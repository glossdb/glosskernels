[project]
name = "glosskernels"
version = "0.1.1"
description = "The TabICL kernel service behind glossql's model doors: three reads over HTTP, the reference package behind them"
requires-python = ">=3.13,<3.14"
license = "Apache-2.0"
dependencies = [
    # Pinned: the oracle fixtures in the port repo were generated with
    # 2.1.1 and 2.2.0 reproduces them (same checkpoints); a move re-runs
    # the parity tests.
    "tabicl==2.2.0",
    "torch>=2.13",
    "numpy>=2",
    "starlette>=1.6",
    "uvicorn>=0.52",
    # The checkpoints come from the hub cache; baked into the image at build.
    "huggingface-hub>=0.30",
    # The second voice (Chronos-2, Apache-2.0); its weights are baked beside the regressor's.
    "chronos-forecasting>=2",
]

[project.optional-dependencies]
# ID tokens verified in-process (GLOSSKERNELS_AUDIENCE); Google's certificates over HTTPS.
auth = ["google-auth>=2.30", "requests>=2.32"]
# Traces, metrics and logs over OTLP/HTTP to a collector (OTEL_EXPORTER_OTLP_ENDPOINT).
otel = [
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
    "opentelemetry-instrumentation-asgi>=0.51b0",
]

[project.scripts]
glosskernels = "glosskernels.__main__:main"

[dependency-groups]
dev = ["pytest>=9", "httpx>=0.28"]
harness = [
    "pandas>=2.2",
    "pyarrow>=17",
    "synthefy-nori>=0.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/glosskernels"]

[tool.pytest.ini_options]
testpaths = ["tests"]
