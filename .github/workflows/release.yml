# The release build: the service image, assembled when a v* tag is
# pushed. A manual dispatch pushes the image by branch and commit — a
# deployment pins a commit between releases. Same shape as glossql's
# release: ghcr.io/glossdb/glosskernels:<version> plus :latest at a tag,
# :<branch> and :sha-<commit> from a dispatch; :latest moves at a tag only.
# This is not CI (tests.yml is): nothing here runs on push.
#
# The image is public on GHCR, so Cloud Run pulls it directly — no
# Artifact Registry, no project name here. The version is `version` in
# pyproject.toml, the one bump point: the tag has to match it, and the
# build bakes it as GLOSSKERNELS_VERSION (/healthz, every log line).
# Before the push the image is started on the runner's CPU and asked
# /healthz — the checkpoints baked, every voice loaded, the version right.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      # What the image calls itself: the version at a tag, sha-<commit> otherwise.
      - id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -1)
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            [ "${GITHUB_REF_NAME}" = "v${version}" ] || { echo "tag ${GITHUB_REF_NAME} is not pyproject's v${version}"; exit 1; }
            echo "version=${version}" >> "$GITHUB_OUTPUT"
          else
            echo "version=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=ref,event=branch
            type=sha
      # The runner's own docker builds it (no buildx container: the image
      # is gigabytes, and it is run here before it is pushed).
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          build-args: VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: smoke
        env:
          IMAGE: ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker run -d --name kernel -p 8100:8100 -e GLOSSKERNELS_DEVICE=cpu "$IMAGE"
          for _ in $(seq 60); do
            if health=$(curl -sf http://127.0.0.1:8100/healthz); then break; fi
            sleep 3
          done
          docker logs kernel
          echo "$health"
          [ "$(echo "$health" | jq -r .loaded)" = true ] || { echo "not loaded"; exit 1; }
          [ "$(echo "$health" | jq -r .version)" = "$VERSION" ] || { echo "version is not $VERSION"; exit 1; }
          docker rm -f kernel
      - run: docker image push --all-tags ghcr.io/${{ github.repository }}
