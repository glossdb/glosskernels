# The wire and the parity against the pinned fixtures, on CPU, on every push.
# The image is release.yml's: built at a v* tag, pushed to GHCR.
name: tests
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('src/glosskernels/kernels.py', 'src/glosskernels/voices.py') }}
      - run: uv sync --frozen --group harness --all-extras
      - run: uv run pytest -q
        env:
          GLOSSKERNELS_DEVICE: cpu
          HF_HUB_DISABLE_TELEMETRY: "1"
